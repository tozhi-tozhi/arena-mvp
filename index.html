<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Arena MVP</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a0a; overflow: hidden; }
      body { display: flex; justify-content: center; align-items: center; }
      /* กันเบราว์เซอร์มือถือเลื่อนหน้า/ซูม/เลือกข้อความตอนเล่น */
      #app, canvas { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #app { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
