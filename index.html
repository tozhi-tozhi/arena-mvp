<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Arena MVP</title>
    <style>
      html, body { 
        margin: 0; 
        width: 100vw; 
        height: 100vh; 
        background: #0a0a0a; /* สีเดียวกับ backgroundColor ใน main.ts */
        overflow: hidden; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
      }
      #app { 
        width: 100%; 
        height: 100%; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
      }
      canvas { 
        display: block; 
        touch-action: none; 
        user-select: none; 
        -webkit-user-select: none; 
        -webkit-touch-callout: none; 
        -webkit-tap-highlight-color: transparent; 
        /* ป้องกันการเบลอจากการขยายของเบราว์เซอร์บางตัว */
        image-rendering: auto; 
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
